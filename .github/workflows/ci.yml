name: CI/CD Pipeline — Mikel Laborategi

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Verify Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (Oxlint)
        run: npm run lint

      - name: Build Application (Vite)
        run: npm run build

      - name: Verify Build Output Artifacts
        run: |
          test -f dist/index.html && echo "Build artifact index.html verified successfully!"
